name: real-stack-webkit

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "ops/**"
      - "docker-compose.dev.yml"
      - ".github/workflows/real-stack-webkit.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-stack-webkit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webkit-linux-real-stack:
    name: WebKit 1.62.1 / Linux / real stack
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 10.33.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.2
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install locked browser dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: Install the exact locked Linux WebKit engine
        working-directory: apps/web
        run: |
          test "$(pnpm exec playwright --version)" = "Version 1.62.1"
          pnpm exec playwright install --with-deps webkit
      - name: Run the isolated real-stack WebKit golden journey
        working-directory: apps/web
        run: >-
          pnpm exec playwright test
          --config=e2e/real-stack/playwright.config.ts
          --project=webkit-linux-real-stack
      - name: Remove isolated real-stack data
        if: ${{ always() }}
        working-directory: apps/web
        run: node e2e/fixtures/real-stack/stack.mjs cleanup
      - name: Upload real-stack failure evidence
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-stack-webkit-evidence-${{ github.sha }}
          path: |
            apps/web/output/playwright/real-stack-report
            apps/web/output/playwright/real-stack-results
          if-no-files-found: ignore
          retention-days: 14
