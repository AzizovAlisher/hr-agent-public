extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  bearertokenauth/otlp:
    filename: /run/secrets/hr_agent_otel_receiver_bearer_tokens

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        tls:
          cert_file: /run/secrets/hr_agent_otel_receiver_certificate
          key_file: /run/secrets/hr_agent_otel_receiver_private_key
        auth:
          authenticator: bearertokenauth/otlp

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 96
  attributes/privacy:
    actions:
      - key: http.request.body
        action: delete
      - key: http.response.body
        action: delete
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.response.header.set-cookie
        action: delete
      - key: url.query
        action: delete
      - key: url.full
        action: delete
      - key: http.url
        action: delete
      - key: http.target
        action: delete
      - key: db.statement
        action: delete
      - key: enduser.id
        action: delete
      - key: user.id
        action: delete
      - key: candidate.id
        action: delete
      - key: tenant.id
        action: delete
  resource/privacy:
    attributes:
      - key: http.request.body
        action: delete
      - key: http.response.body
        action: delete
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.response.header.set-cookie
        action: delete
      - key: url.query
        action: delete
      - key: url.full
        action: delete
      - key: http.url
        action: delete
      - key: http.target
        action: delete
      - key: db.statement
        action: delete
      - key: enduser.id
        action: delete
      - key: user.id
        action: delete
      - key: candidate.id
        action: delete
      - key: tenant.id
        action: delete
  batch:
    timeout: 5s
    send_batch_size: 2048
    send_batch_max_size: 4096

# The entire exporter mapping is a mounted secret so credentials never appear
# in the Compose model, process environment, or source-controlled config.
exporters: ${file:/run/secrets/hr_agent_otel_trace_exporters}

service:
  extensions: [health_check, bearertokenauth/otlp]
  telemetry:
    logs:
      level: warn
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/privacy, attributes/privacy, batch]
      exporters: [otlphttp/trace_backend]
