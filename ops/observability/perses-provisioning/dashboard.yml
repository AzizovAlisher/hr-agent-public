kind: Dashboard
metadata:
  name: operations
  project: hr-agent
spec:
  display:
    name: HR Agent Operations
  duration: 1h
  panels:
    readiness:
      kind: Panel
      spec:
        display:
          name: Dependency readiness
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: min(hr_readiness_overall_ok)
    serverErrorRate:
      kind: Panel
      spec:
        display:
          name: Aggregate API 5xx ratio
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: sum(rate(hr_http_requests_total{status_class="5xx"}[5m])) / clamp_min(sum(rate(hr_http_requests_total[5m])), 0.001)
    apiP95:
      kind: Panel
      spec:
        display:
          name: Aggregate API p95 latency
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: histogram_quantile(0.95, sum by (le) (rate(hr_http_request_duration_seconds_bucket[10m])))
    oldestQueueWork:
      kind: Panel
      spec:
        display:
          name: Oldest due work by queue
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: max by (queue) (hr_queue_oldest_due_age_seconds)
    workerCoverage:
      kind: Panel
      spec:
        display:
          name: Worker freshness and missing queues
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: hr_worker_fresh_replicas
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: hr_worker_missing_queues
    activeAlerts:
      kind: Panel
      spec:
        display:
          name: Firing alerts
        plugin:
          kind: TimeSeriesChart
          spec: {}
        queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  query: 'ALERTS{alertstate="firing"}'
  layouts:
    - kind: Grid
      spec:
        display:
          title: Pilot operations
          collapse:
            open: true
        items:
          - x: 0
            y: 0
            width: 12
            height: 6
            content:
              $ref: '#/spec/panels/readiness'
          - x: 12
            y: 0
            width: 12
            height: 6
            content:
              $ref: '#/spec/panels/activeAlerts'
          - x: 0
            y: 6
            width: 12
            height: 7
            content:
              $ref: '#/spec/panels/serverErrorRate'
          - x: 12
            y: 6
            width: 12
            height: 7
            content:
              $ref: '#/spec/panels/apiP95'
          - x: 0
            y: 13
            width: 12
            height: 7
            content:
              $ref: '#/spec/panels/oldestQueueWork'
          - x: 12
            y: 13
            width: 12
            height: 7
            content:
              $ref: '#/spec/panels/workerCoverage'
