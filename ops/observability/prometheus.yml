global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/hr-agent-alerts.yml

alerting:
  alertmanagers:
    - scheme: http
      static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: hr-agent-api
    metrics_path: /internal/metrics
    scheme: http
    bearer_token_file: /run/secrets/hr_agent_metrics_token
    static_configs:
      - targets:
          - api:8000
        labels:
          service: hr-agent-api
          environment: pilot

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093

  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:8888

  - job_name: perses
    metrics_path: /metrics
    static_configs:
      - targets:
          - perses:8080
